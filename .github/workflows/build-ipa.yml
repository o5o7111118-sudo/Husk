name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu python@3.12 || true
          rustup target add aarch64-apple-ios
      - name: Build
        run: ./scripts/ci_build.sh build/Husk.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Husk-ar-ipa
          path: build/Husk.ipa
          if-no-files-found: error
