# Builds Husk.ipa (with the Arabic localization) on a GitHub macOS runner.
# Put this file at .github/workflows/build-ipa.yml in YOUR fork, push, then Actions > "Build IPA" > Run workflow.
# Untested: the full native build (QEMU, ANGLE, virglrenderer) is long; the job limit is 6 hours.
name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu python@3.12 || true
          rustup target add aarch64-apple-ios
          xcodebuild -version
      - name: Build
        run: ./scripts/ci_build.sh build/Husk.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Husk-ar-ipa
          path: build/Husk.ipa
          if-no-files-found: error
